        <p>Fill out the form or reach out via social media.</p>

        <form action="#">

                <label>Name</label>
                <input type="text" placeholder="Your Name" required>
            </div>

                <label>Email</label>
                <input type="email" placeholder="Your Email" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="3" placeholder="How can I help?"></textarea>
            </div>
            <button type="submit" class="send-btn">Send Message</button>
        </form>
